services:
  mysql:
    image: mysql:8.0
    container_name: projeto_umbanda_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"

    volumes:
      - dados_mysql:/var/lib/mysql

volumes:
  dados_mysql: